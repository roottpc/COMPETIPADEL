<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02060f"><title>CompetiPadel</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><script src="firebase-config.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{
  --bg:#02060f;--bg2:#061126;--card:rgba(10,24,50,.72);--card2:rgba(14,34,70,.85);--line:rgba(90,180,255,.16);--line2:rgba(0,229,255,.35);
  --neon:#00e5ff;--neon2:#38bdff;--blue:#2563ff;--violet:#7c5cff;--ice:#eaf7ff;--muted:#86a3c7;--dim:#4d6788;
  --ok:#2bf5b0;--bad:#ff4d6d;--gold:#ffd166;--silver:#cfe3ff;--bronze:#ffab70;
  --r:16px;--nav:64px;--tick:46px;
  --glow:0 0 18px rgba(0,229,255,.45),0 0 42px rgba(37,99,255,.25);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ice);font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(900px 520px at 85% -8%,rgba(0,200,255,.16),transparent 60%),
  radial-gradient(700px 480px at -15% 105%,rgba(37,99,255,.18),transparent 60%),
  linear-gradient(180deg,#02060f,#030a19 60%,#02060f);background-attachment:fixed;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
  background-image:linear-gradient(rgba(0,229,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.6) 1px,transparent 1px);background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 70%)}
h1,h2,h3,.disp{font-family:'Chakra Petch','Inter',sans-serif;letter-spacing:.02em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--neon)}
.hide{display:none!important}

/* ---------- header ---------- */
#hdr{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 14px 10px;
  background:linear-gradient(180deg,rgba(2,6,15,.96),rgba(2,6,15,.78));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand svg{width:30px;height:30px;filter:drop-shadow(0 0 8px rgba(0,229,255,.7))}
.brand .t1{font-family:'Chakra Petch',system-ui,sans-serif;font-weight:700;font-size:18px;letter-spacing:.06em;line-height:1;background:linear-gradient(90deg,#fff,#7deeff 60%,#3b8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .t2{font-size:8.5px;letter-spacing:.22em;color:var(--neon);opacity:.85;margin-top:3px}
.ibtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(10,26,54,.7);display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn:active{transform:scale(.94)}
.ibtn svg{width:19px;height:19px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;
  background:linear-gradient(135deg,#0a3a66,#123d9e);border:1.5px solid var(--neon);box-shadow:0 0 12px rgba(0,229,255,.35);cursor:pointer;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ---------- main ---------- */
#main{padding:14px 14px calc(var(--nav) + var(--tick) + 28px + var(--sab));max-width:980px;margin:0 auto;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec{margin:18px 0 10px;display:flex;align-items:center;gap:10px}
.sec h2{font-size:15px;text-transform:uppercase;letter-spacing:.14em;color:var(--neon2)}
.sec .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative;backdrop-filter:blur(6px)}
.card+.card{margin-top:10px}
.card.tap{cursor:pointer;transition:transform .12s,border-color .2s}
.card.tap:active{transform:scale(.985)}
.card.tap:hover{border-color:var(--line2)}
.glow{box-shadow:var(--glow);border-color:var(--line2)}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:4px}
.grow{flex:1;min-width:0}
.mut{color:var(--muted)}.dim{color:var(--dim)}.sm{font-size:12.5px}.xs{font-size:11px}
.b{font-weight:700}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid2>*,.grid3>*{min-width:0}
@media(min-width:760px){.gridA{display:grid;grid-template-columns:1fr 1fr;gap:12px}.gridA .card+.card{margin-top:0}}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty svg{width:56px;height:56px;opacity:.6;margin-bottom:8px}

/* ---------- buttons ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line2);
  background:rgba(0,229,255,.08);color:var(--ice);font-weight:600;cursor:pointer;transition:transform .1s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{border:0;color:#011322;background:linear-gradient(135deg,#5ff3ff,#00c8ff 45%,#2b7bff);box-shadow:0 6px 24px rgba(0,200,255,.35)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.bad{border-color:rgba(255,77,109,.5);background:rgba(255,77,109,.1);color:#ffc2cd}
.btn.sm{height:36px;padding:0 12px;border-radius:11px;font-size:13px}
.btn.blk{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn svg{width:18px;height:18px}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + var(--tick) + 18px + var(--sab));z-index:25;height:54px;border-radius:18px;padding:0 20px}

/* ---------- chips / badges ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(10,26,54,.6);display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip.on{color:#011322;background:linear-gradient(135deg,#6ff5ff,#22c7ff);border-color:transparent;font-weight:700;box-shadow:0 0 14px rgba(0,229,255,.4)}
.bdg{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.03em;background:rgba(0,229,255,.12);color:var(--neon);border:1px solid rgba(0,229,255,.25);white-space:nowrap}
.bdg.g{background:rgba(43,245,176,.12);color:var(--ok);border-color:rgba(43,245,176,.3)}
.bdg.r{background:rgba(255,77,109,.12);color:#ff8aa0;border-color:rgba(255,77,109,.3)}
.bdg.y{background:rgba(255,209,102,.12);color:var(--gold);border-color:rgba(255,209,102,.3)}
.bdg.v{background:rgba(124,92,255,.15);color:#b7a6ff;border-color:rgba(124,92,255,.35)}
.elo{font-family:'Chakra Petch',system-ui,sans-serif;font-weight:700;color:var(--neon);text-shadow:0 0 10px rgba(0,229,255,.5)}

/* ---------- forms ---------- */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld>label{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.inp{height:48px;border-radius:13px;border:1px solid var(--line);background:rgba(3,12,28,.8);padding:0 14px;outline:none;width:100%;transition:border-color .2s,box-shadow .2s}
textarea.inp{height:auto;min-height:92px;padding:12px 14px;resize:vertical}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--neon) 50%),linear-gradient(135deg,var(--neon) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.inp:focus{border-color:var(--neon);box-shadow:0 0 0 3px rgba(0,229,255,.15)}
.pin{font-family:'Chakra Petch',system-ui,sans-serif;font-size:30px;letter-spacing:.6em;text-align:center;height:62px;padding-left:.6em}
.seg{display:flex;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:rgba(3,12,28,.8)}
.seg button{flex:1;height:44px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-weight:600;font-size:13.5px}
.seg button.on{background:linear-gradient(135deg,rgba(0,229,255,.25),rgba(37,99,255,.3));color:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,229,255,.08);font-size:22px;cursor:pointer}
.stepper .v{font-family:'Chakra Petch',system-ui,sans-serif;font-size:22px;font-weight:700;min-width:34px;text-align:center}

/* ---------- lists ---------- */
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.tap{cursor:pointer}
.pos{width:30px;text-align:center;font-family:'Chakra Petch',system-ui,sans-serif;font-weight:700;color:var(--muted)}
.ini{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:linear-gradient(135deg,#0b2b55,#0f2f7a);border:1px solid var(--line);overflow:hidden}
.ini img{width:100%;height:100%;object-fit:cover}

/* ---------- tabs nav ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--nav) + var(--sab));padding-bottom:var(--sab);display:flex;
  background:rgba(2,7,18,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
#nav button{flex:1;border:0;background:transparent;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.04em;cursor:pointer;position:relative}
#nav button svg{width:23px;height:23px}
#nav button.on{color:var(--neon)}
#nav button.on svg{filter:drop-shadow(0 0 6px rgba(0,229,255,.8))}
#nav button.on:before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--neon);box-shadow:0 0 12px var(--neon)}

/* ---------- ticker ---------- */
#ticker{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--sab));z-index:39;height:var(--tick);overflow:hidden;
  background:linear-gradient(90deg,rgba(0,40,80,.92),rgba(5,20,50,.92));border-top:1px solid var(--line2);border-bottom:1px solid var(--line)}
#ticker:before,#ticker:after{content:"";position:absolute;top:0;bottom:0;width:40px;z-index:2;pointer-events:none}
#ticker:before{left:0;background:linear-gradient(90deg,#03142c,transparent)}
#ticker:after{right:0;background:linear-gradient(-90deg,#03142c,transparent)}
.tk-track{display:flex;align-items:center;height:100%;width:max-content;animation:tick linear infinite}
#ticker:hover .tk-track,#ticker:active .tk-track{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk-it{display:flex;align-items:center;gap:9px;padding:0 22px;height:100%;cursor:pointer;border-right:1px solid var(--line);white-space:nowrap;font-size:13px;font-weight:600}
.tk-it img,.tk-it .lg{height:30px;width:30px;border-radius:8px;object-fit:contain;background:#fff1;flex:none}
.tk-it .pr{color:var(--neon);font-weight:500;font-size:12px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.tk-lbl{position:absolute;left:0;top:0;bottom:0;z-index:3;display:flex;align-items:center;padding:0 10px;font-size:9px;letter-spacing:.2em;color:#011322;font-weight:800;background:var(--neon);writing-mode:vertical-rl;transform:rotate(180deg)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,4,12,.66);backdrop-filter:blur(4px);animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#0a1a36,#050e20);border:1px solid var(--line2);border-bottom:0;border-radius:22px 22px 0 0;
  padding:8px 16px calc(18px + var(--sab));box-shadow:0 -10px 50px rgba(0,180,255,.18);animation:up .24s cubic-bezier(.2,.9,.3,1.1)}
@media(min-width:760px){#modal{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--line2)}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:4px;border-radius:9px;background:var(--line2);margin:4px auto 12px}
.sheet h3{font-size:19px;margin-bottom:12px}
.acts{display:flex;gap:10px;margin-top:16px}
.acts .btn{flex:1}
#toast{position:fixed;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(92vw,420px)}
.tst{padding:12px 16px;border-radius:14px;background:rgba(6,22,46,.97);border:1px solid var(--line2);box-shadow:var(--glow);font-size:14px;animation:up .2s}
.tst.err{border-color:rgba(255,77,109,.6);box-shadow:0 0 20px rgba(255,77,109,.3)}
#busy{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(0,4,12,.35)}
.spin{width:46px;height:46px;border-radius:50%;border:3px solid rgba(0,229,255,.18);border-top-color:var(--neon);animation:rot .7s linear infinite;box-shadow:0 0 20px rgba(0,229,255,.3)}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- hero / login ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 22px;text-align:center}
.bigd{width:118px;height:118px;filter:drop-shadow(0 0 22px rgba(0,229,255,.75)) drop-shadow(0 0 60px rgba(37,99,255,.5));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}
.login h1{font-size:34px;letter-spacing:.08em;margin-top:18px;background:linear-gradient(90deg,#fff,#7deeff,#3b8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.login .tag{color:var(--neon);letter-spacing:.38em;font-size:11px;margin:6px 0 28px}
.login .box{width:100%;max-width:380px;text-align:left}
.demo{margin-top:18px;font-size:12.5px;color:var(--muted);border:1px dashed var(--line2);border-radius:14px;padding:12px}

/* ---------- hero card ---------- */
.hero{background:linear-gradient(135deg,rgba(0,229,255,.16),rgba(37,99,255,.22) 60%,rgba(124,92,255,.2));border:1px solid var(--line2);border-radius:20px;padding:18px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(0,229,255,.35),transparent 65%)}
.hero .big{font-family:'Chakra Petch',system-ui,sans-serif;font-size:40px;font-weight:700;line-height:1;text-shadow:0 0 18px rgba(0,229,255,.6)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--ice);cursor:pointer}
.qa button svg{width:26px;height:26px;color:var(--neon);filter:drop-shadow(0 0 6px rgba(0,229,255,.5))}
.qa button:active{transform:scale(.95)}

/* ---------- sub tabs ---------- */
.stabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:14px -14px 12px;padding:0 14px;scrollbar-width:none;position:sticky;top:calc(59px + var(--sat));z-index:20;background:rgba(2,6,15,.92);backdrop-filter:blur(10px)}
.stabs::-webkit-scrollbar{display:none}
.stabs button{flex:none;border:0;background:none;color:var(--muted);height:44px;padding:0 13px;font-weight:600;font-size:13.5px;cursor:pointer;position:relative}
.stabs button.on{color:var(--neon)}
.stabs button.on:after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--neon);box-shadow:0 0 10px var(--neon)}

/* ---------- tournament ---------- */
.tban{border-radius:20px;padding:16px;background:linear-gradient(135deg,#06213f,#0b1f5c 70%,#24166b);border:1px solid var(--line2);position:relative;overflow:hidden}
.tban .lg{width:56px;height:56px;border-radius:14px;object-fit:cover;background:#fff1;flex:none;display:grid;place-items:center;overflow:hidden}
.tban h1{font-size:22px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gcard .gh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:linear-gradient(90deg,rgba(0,229,255,.16),transparent);border-bottom:1px solid var(--line)}
.gcard .gh b{font-family:'Chakra Petch',system-ui,sans-serif;font-size:16px;letter-spacing:.08em}
table.st{width:100%;border-collapse:collapse;font-size:13px}
table.st th{font-size:10.5px;color:var(--dim);font-weight:600;text-align:center;padding:6px 4px;letter-spacing:.05em}
table.st th:nth-child(2){text-align:left}
table.st td{padding:8px 4px;text-align:center;border-top:1px solid var(--line)}
table.st td.nm{text-align:left;max-width:0;width:60%}
table.st td.nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr.q td{background:rgba(0,229,255,.06)}
tr.q td.nm{color:#fff}
tr.q td:first-child{box-shadow:inset 3px 0 0 var(--neon)}
tr.out td{color:var(--dim)}
tr.out td.nm div{text-decoration:line-through;text-decoration-color:rgba(255,77,109,.8);text-decoration-thickness:2px}
.mt{display:flex;align-items:stretch;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer}
.mt+.mt{margin-top:8px}
.mt .ct{width:46px;flex:none;border-radius:10px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.mt .ct b{font-family:'Chakra Petch',system-ui,sans-serif;font-size:20px;color:var(--neon)}
.mt .ct span{font-size:8.5px;letter-spacing:.12em;color:var(--muted);margin-top:3px}
.mt .sd{display:flex;align-items:center;gap:8px;font-size:13.5px;min-height:24px}
.mt .sd .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt .sd .s{font-family:'Chakra Petch',system-ui,sans-serif;font-weight:700;font-size:18px;min-width:22px;text-align:right}
.mt .sd.w .n{color:#fff;font-weight:600}.mt .sd.w .s{color:var(--neon)}
.mt .sd.l{opacity:.55}
.mt.fin{border-color:rgba(43,245,176,.18)}
.tl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0 8px;font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.tl b{color:var(--neon2)}

/* bracket */
.brk{display:flex;gap:18px;overflow-x:auto;padding:6px 2px 16px}
.brk .rd{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-width:200px}
.brk .rh{font-size:11px;letter-spacing:.14em;color:var(--neon);text-transform:uppercase;text-align:center;margin-bottom:4px}
.bm{background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.bm .bs{display:flex;align-items:center;gap:6px;padding:7px 9px;font-size:12.5px;min-height:32px}
.bm .bs+.bs{border-top:1px solid var(--line)}
.bm .bs .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm .bs .s{font-family:'Chakra Petch',system-ui,sans-serif;font-weight:700;font-size:15px}
.bm .bs.w{background:rgba(0,229,255,.1)}.bm .bs.w .n{color:#fff;font-weight:600}.bm .bs.w .s{color:var(--neon)}
.bm .bs.l{opacity:.5}
.bm .cc{position:absolute;right:6px;top:-1px;font-size:9px;color:var(--muted)}
.champ{text-align:center;padding:18px;border-radius:18px;background:linear-gradient(135deg,rgba(255,209,102,.18),rgba(0,229,255,.12));border:1px solid rgba(255,209,102,.4)}

/* ranking */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:8px 0 14px}
.pd{text-align:center;border-radius:18px 18px 10px 10px;padding:14px 6px 12px;background:var(--card);border:1px solid var(--line)}
.pd .md{width:54px;height:54px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-family:'Chakra Petch',system-ui,sans-serif;font-weight:700;font-size:18px;overflow:hidden}
.pd.p1{padding-top:22px;border-color:rgba(255,209,102,.5);box-shadow:0 0 30px rgba(255,209,102,.15)}
.pd.p1 .md{background:linear-gradient(135deg,#ffe08a,#c99a2e);color:#3a2800;width:64px;height:64px}
.pd.p2 .md{background:linear-gradient(135deg,#eef6ff,#93a9c4);color:#1b2a3c}
.pd.p3 .md{background:linear-gradient(135deg,#ffc79a,#b0643a);color:#3a1a05}
.pd .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.elite{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:12px;border-radius:16px;background:linear-gradient(90deg,rgba(255,209,102,.07),rgba(0,229,255,.08),rgba(255,209,102,.07));border:1px solid rgba(255,209,102,.25);margin-bottom:12px}
.elite .el{display:flex;align-items:center;gap:8px;cursor:pointer}
.elite .el img,.elite .el .lg{height:40px;width:40px;object-fit:contain;border-radius:10px;background:#fff1}
.elite .lbl{width:100%;text-align:center;font-size:9.5px;letter-spacing:.3em;color:var(--gold)}
.rk{display:grid;grid-template-columns:30px 38px 1fr auto;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.rk .st{font-size:11px;color:var(--muted)}

/* sede */
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:16px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{height:200px;width:auto;max-width:88%;border-radius:16px;scroll-snap-align:start;object-fit:cover;flex:none}
.upl{display:flex;gap:8px;flex-wrap:wrap}
.upl .th{width:74px;height:74px;border-radius:12px;overflow:hidden;position:relative;border:1px solid var(--line);background:#fff1}
.upl .th img{width:100%;height:100%;object-fit:cover}
.upl .th button{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;border:0;background:#000b;color:#fff;cursor:pointer;font-size:13px;line-height:1}
.upl .add{width:74px;height:74px;border-radius:12px;border:1.5px dashed var(--line2);display:grid;place-items:center;color:var(--neon);cursor:pointer;font-size:26px;background:transparent}

/* picker */
.picker{position:relative}
.pkres{margin-top:6px;border-radius:13px;overflow:hidden;border:1px solid var(--line);background:#041026}
.pkres:empty{display:none}
.pkr{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:14px}
.pkr:last-child{border-bottom:0}
.pkr:hover,.pkr:active{background:rgba(0,229,255,.08)}
.sel{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sel .chip{color:var(--ice);border-color:var(--line2)}
.pairrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}

/* ---------- TV ---------- */
#tv{position:fixed;inset:0;z-index:100;background:#01040c;overflow:hidden;display:flex;flex-direction:column;font-size:1.25vw}
#tv:before{content:"";position:absolute;inset:0;background:radial-gradient(60vw 40vw at 85% 0%,rgba(0,200,255,.18),transparent 60%),radial-gradient(50vw 40vw at 0% 100%,rgba(37,99,255,.2),transparent 60%);pointer-events:none}
.tvh{display:flex;align-items:center;gap:1.4vw;padding:1.2vw 2vw;border-bottom:1px solid var(--line2);background:linear-gradient(90deg,rgba(0,229,255,.12),transparent 50%,rgba(37,99,255,.12));position:relative}
.tvh svg{width:4vw;height:4vw;filter:drop-shadow(0 0 1vw rgba(0,229,255,.8))}
.tvh h1{font-size:2.4vw;letter-spacing:.1em}
.tvh .clk{font-family:'Chakra Petch',system-ui,sans-serif;font-size:2.6vw;font-weight:700;color:var(--neon);text-shadow:0 0 1vw rgba(0,229,255,.6)}
.tvh .el img,.tvh .el .lg{height:3.6vw;width:3.6vw;object-fit:contain;border-radius:.6vw;background:#fff1}
.tvb{flex:1;position:relative;padding:1.4vw 2vw;overflow:hidden}
.tvs{position:absolute;inset:1.4vw 2vw;animation:tvin .7s ease}
@keyframes tvin{from{opacity:0;transform:translateX(3vw)}to{opacity:1;transform:none}}
.tvt{font-family:'Chakra Petch',system-ui,sans-serif;font-size:1.9vw;letter-spacing:.2em;color:var(--neon);margin-bottom:1vw;text-transform:uppercase;display:flex;align-items:center;gap:1vw}
.tvt:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.tvgrid{display:grid;gap:1vw}
.tvc{background:rgba(10,26,56,.8);border:1px solid var(--line2);border-radius:1vw;padding:1vw 1.2vw}
.tvc .cn{font-family:'Chakra Petch',system-ui,sans-serif;font-size:1vw;letter-spacing:.2em;color:var(--neon)}
.tvc .pr{display:flex;justify-content:space-between;align-items:center;font-size:1.35vw;margin:.4vw 0;gap:1vw}
.tvc .pr span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvc .pr b{font-family:'Chakra Petch',system-ui,sans-serif;font-size:1.9vw;color:var(--neon)}
#tv table.st{font-size:1.05vw}#tv table.st th{font-size:.8vw}#tv table.st td{padding:.45vw .3vw}
#tv .bm .bs{font-size:1vw;min-height:2.2vw;padding:.4vw .6vw}#tv .bm .bs .s{font-size:1.2vw}
#tv .brk .rd{min-width:14vw}#tv .brk .rh{font-size:.9vw}
#tv .rk{grid-template-columns:3vw 3vw 1fr auto;font-size:1.3vw;padding:.6vw .4vw}
#tv .ini{width:3vw;height:3vw;font-size:1vw;border-radius:.7vw}
#tv #tvtick{position:relative;height:5.4vw;border-top:1px solid var(--line2);background:linear-gradient(90deg,rgba(0,40,80,.95),rgba(5,20,50,.95));overflow:hidden}
#tv .tk-it{font-size:1.25vw;padding:0 2vw}#tv .tk-it img,#tv .tk-it .lg{height:3.6vw;width:3.6vw}#tv .tk-it .pr{font-size:1.05vw;max-width:22vw}
.tvx{position:absolute;right:1vw;top:1vw;z-index:5;opacity:0;transition:opacity .3s}
#tv:hover .tvx{opacity:1}
.tvdots{position:absolute;bottom:.6vw;left:50%;transform:translateX(-50%);display:flex;gap:.5vw}
.tvdots i{width:.6vw;height:.6vw;border-radius:50%;background:var(--line2)}.tvdots i.on{background:var(--neon);box-shadow:0 0 .6vw var(--neon)}

.alias{color:var(--neon);font-weight:500;font-size:.88em}
.mt .sd .s i,.bm .bs .s i,#tv .pr b i{font-style:normal;display:inline-block;min-width:1.15em;text-align:center;opacity:.6}
.mt .sd .s i.sw,.bm .bs .s i.sw,#tv .pr b i.sw{opacity:1}
.mt .sd .s i.st,.bm .bs .s i.st{font-size:.8em}
.mt .sd .s sup,.bm .bs .s sup{font-size:.55em;margin-left:1px;opacity:.85}
.sethead,.setrow,.tierow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sethead .tn{flex:1;font-size:12px;font-weight:600;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.setrow .sl,.tierow .sl,.sethead .sl{width:70px;flex:none;font-size:13px;font-weight:700;color:var(--ice);line-height:1.1}
.setrow .sl small,.tierow .sl small{display:block;font-size:10px;color:var(--muted);font-weight:500}
.setrow .inp,.tierow .inp{flex:1;text-align:center;font-size:24px;font-family:'Chakra Petch',system-ui,sans-serif;font-weight:700;height:50px;padding:0}
.tierow{margin:-2px 0 10px;padding:6px 0 6px;border-radius:12px;background:rgba(255,209,102,.07)}
.tierow .inp{font-size:18px;height:40px}
.setrow .dash,.tierow .dash,.sethead .dash{width:10px;text-align:center;color:var(--muted)}
.setrow.hide,.tierow.hide{display:none}
.setres{text-align:center;font-size:13px;margin:6px 0 4px;min-height:18px}
.card.hascov{padding-top:0;overflow:hidden}
.tcov{margin:0 -14px 12px;height:130px;position:relative;background:#0a1628}
.tcov img{width:100%;height:100%;object-fit:cover;display:block}
.tcov span{position:absolute;right:8px;bottom:8px;background:#000a;color:#fff;font-size:11px;padding:3px 8px;border-radius:20px}
.upl .th .cov{position:absolute;left:4px;bottom:4px;background:var(--neon);color:#001;font-size:9px;font-weight:800;padding:1px 5px;border-radius:6px}
.setrow input::-webkit-inner-spin-button,.setrow input::-webkit-outer-spin-button,.tierow input::-webkit-inner-spin-button,.tierow input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.setrow input,.tierow input{-moz-appearance:textfield}

  let db;
  try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
  catch (e) { db = initializeFirestore(app, {}); }

  function batchOf(ops) {
    const b = writeBatch(db);
    ops.forEach(o => {
      const r = doc(db, o.col, o.id);
      if (o.op === 'delete') b.delete(r);
      else if (o.op === 'update') b.update(r, o.data);
